<!doctype html><meta charset="utf-8"><title>Right-click blocked</title>
<style>body{user-select:none} .wrap{position:relative;width:320px;height:200px} .wrap img{width:100%;height:100%;pointer-events:none} .shield{position:absolute;inset:0}</style>
<h1>Blocked</h1>
<!-- Context menu cancelled on the whole page, the image can't be dragged or selected, and an empty div sits on top. -->
<div class="wrap" id="wrap"><img id="photo" alt="Protected" draggable="false" src="../photo.jpg"><div class="shield" id="shield"></div></div>
<script>
  document.addEventListener("contextmenu", (e) => { e.preventDefault(); window.__blocked = (window.__blocked || 0) + 1; });
  document.addEventListener("dragstart", (e) => e.preventDefault());
</script>
