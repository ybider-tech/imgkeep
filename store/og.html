<!doctype html>
<!-- Social master, 1200×630. Render with npm run og. Brand: Cobalt Pop / photographic flower. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Schibsted Grotesk"; font-weight: 700; src: url("../site/fonts/schibsted-grotesk-700-latin.woff2") format("woff2"); }
    html, body { margin: 0; }
    #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #2347f7; color: #fff; font-family: Arial, sans-serif; }
    .brand { position: absolute; left: 72px; top: 58px; display: flex; align-items: center; gap: 10px; font: 700 34px "Schibsted Grotesk", sans-serif; }
    .brand img { width: 52px; height: 52px; }
    h1 { position: absolute; left: 72px; top: 166px; margin: 0; font: 700 84px/1.19 "Schibsted Grotesk", sans-serif; }
    h1 span { display: block; color: #adffcd; }
    p { position: absolute; left: 76px; top: 393px; margin: 0; font-size: 27px; line-height: 41px; }
    .pills { position: absolute; left: 72px; top: 516px; display: flex; gap: 12px; }
    .pills b { box-sizing: border-box; height: 42px; padding: 7px 18px; border-radius: 21px; background: #adffcd; color: #2347f7; font: 700 21px "Schibsted Grotesk", sans-serif; }
    .flower { position: absolute; left: 680px; top: 84px; width: 465px; height: 465px; object-fit: contain; }
  </style>
</head>
<body>
  <div id="og">
    <div class="brand"><img src="../site/icon128.png" alt="">imgkeep</div>
    <h1>Any image.<span>Your format.</span></h1>
    <p>Save images. Copy colours.<br>Right from your browser.</p>
    <div class="pills"><b>Free</b><b>No uploads</b><b>Open source</b></div>
    <img class="flower" src="icon-pack/imgkeep-social-flower.png" alt="Orange poppy in an image frame with a mint download arrow">
  </div>
</body>
</html>
