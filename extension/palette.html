<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="paletteTitle">Colour palette</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 16px 20px 18px; font-size: 14px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    header img { width: 28px; height: 28px; }
    header h1 { margin: 0; font-size: 1.15rem; }
    .stage {
      position: relative;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center;
      height: 150px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .stage .note {
      position: absolute; inset: auto 8px 8px auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 8px; font-size: 0.85em;
    }
    /* How much of the image each colour covers. */
    .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0 12px; border: 1px solid var(--border); }
    .bar span { display: block; height: 100%; }
    .switches { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
    fieldset { border: 0; padding: 0; margin: 0; display: flex; align-items: center; gap: 8px; }
    legend { float: inline-start; font-weight: 600; padding: 0; margin-inline-end: 4px; }
    .seg { display: flex; gap: 4px; }
    .seg label {
      border: 1px solid var(--border); border-radius: 8px; padding: 0.2em 0.7em; cursor: pointer;
      background: var(--surface); font-weight: 600;
    }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
    .swatches { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
    .swatch { padding: 0; width: 100%; border-radius: 10px; overflow: hidden; text-align: center; font-weight: 500; }
    .swatch .chip { display: block; height: 54px; background: var(--c); border-bottom: 1px solid var(--border); }
    .swatch .value { display: block; padding: 4px 2px; font-size: 11.5px; line-height: 1.3; word-break: break-word; }
    .swatch.copied { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
    .row .label { font-weight: 600; margin-inline-end: 4px; }
    .row button { padding: 0.3em 0.75em; }
    #status { min-height: 1.5em; margin: 10px 0 0; font-weight: 600; word-break: break-all; }
    #problem { margin-top: 12px; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
    .foot p { margin: 0; font-size: 0.88em; }
    .detail { word-break: break-all; }
  </style>
  <script type="module" src="palette.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <h1 data-i18n="paletteTitle">Colour palette</h1>
    </header>

    <div class="stage" id="stage" aria-busy="true">
      <img id="thumb" alt="" data-i18n-alt="editPreviewAlt" hidden>
      <span class="note" id="stageNote" data-i18n="paletteLoading">Finding the colours…</span>
    </div>
    <div class="bar" id="bar" aria-hidden="true"></div>

    <div id="problem" hidden></div>

    <div id="tools" hidden>
      <div class="switches">
        <fieldset>
          <legend data-i18n="paletteCount">Colours</legend>
          <div class="seg">
            <label><input type="radio" name="count" value="5"> 5</label>
            <label><input type="radio" name="count" value="8"> 8</label>
            <label><input type="radio" name="count" value="12"> 12</label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="editFormat">Format</legend>
          <div class="seg">
            <label><input type="radio" name="format" value="hex"> HEX</label>
            <label><input type="radio" name="format" value="rgb"> RGB</label>
            <label><input type="radio" name="format" value="hsl"> HSL</label>
          </div>
        </fieldset>
      </div>

      <ul class="swatches" id="swatches" data-i18n-aria-label="paletteSwatches" aria-label="The image's main colours, largest first"></ul>

      <div class="row" role="group" aria-labelledby="codeLabel">
        <span class="label" id="codeLabel" data-i18n="paletteCopyAll">Copy all as</span>
        <button type="button" data-code="css" data-i18n="paletteCodeCss">CSS variables</button>
        <button type="button" data-code="tailwind" data-i18n="paletteCodeTailwind">Tailwind</button>
        <button type="button" data-code="json" data-i18n="paletteCodeJson">JSON</button>
        <button type="button" data-code="list" data-i18n="paletteCodeList">List</button>
      </div>
      <div class="row" role="group" aria-labelledby="saveLabel">
        <span class="label" id="saveLabel" data-i18n="paletteSaveAs">Save as</span>
        <button type="button" data-save="png" data-i18n="paletteSavePng">PNG swatches</button>
        <button type="button" data-save="gpl" data-i18n="paletteSaveGpl">GIMP palette</button>
        <button type="button" data-save="ase" data-i18n="paletteSaveAse">Adobe swatches</button>
      </div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <div class="foot">
      <p class="muted" data-i18n="paletteNote">Worked out on your computer. The image and its colours never leave it.</p>
      <button type="button" id="close" data-i18n="askClose">Close</button>
    </div>
    <div id="review"></div>
  </main>
</body>
</html>
