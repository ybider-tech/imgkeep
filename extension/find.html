<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="findWindowTitle">Find image</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 18px 20px; font-size: 14px; }
    .head { display: flex; gap: 12px; align-items: flex-start; }
    .head img { width: 32px; height: 32px; flex: none; margin-top: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .grid button {
      padding: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; display: block;
      background: repeating-conic-gradient(var(--border) 0 25%, var(--surface) 0 50%) 0 0 / 14px 14px;
    }
    .grid img { width: 100%; height: 100%; object-fit: contain; display: block; } /* the whole image, not a crop */
    #status { min-height: 1.4em; margin-top: 10px; font-weight: 600; }
  </style>
  <script type="module" src="find.js"></script>
</head>
<body>
  <main>
    <div class="head">
      <img src="icons/icon48.png" alt="">
      <div>
        <h1 id="title" data-i18n="findWindowTitle">Find image</h1>
        <div id="body"></div>
      </div>
    </div>
    <div class="grid" id="grid" hidden></div>
    <div class="actions" id="actions"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
